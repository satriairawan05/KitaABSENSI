<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KitaABSENSI - Login</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/kita-absensi.css" />
</head>
<body id="login" x-data="loginApp()" x-init="init()">

    <div class="container-fluid d-flex align-items-center justify-content-center min-vh-100 bg-gradient-maroon p-3">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="login-card p-4 p-md-5 shadow-lg rounded-4 bg-white">
                    <div class="text-center mb-4">
                        <div class="login-icon-wrapper mx-auto mb-3">
                            <i class="bi bi-check-circle-fill fs-1" style="color: #7a2a3a;"></i>
                        </div>
                        <h2 class="fw-bold" style="color: #7a2a3a;">KitaABSENSI</h2>
                        <p class="text-secondary small">Silakan login untuk melanjutkan</p>
                    </div>

                    <form @submit.prevent="login">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" style="color: #3d1a1a;">Email</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 bg-light-maroon" style="border-color: #dcc8c8; border-right: none;">
                                    <i class="bi bi-envelope" style="color: #7a2a3a;"></i>
                                </span>
                                <input type="email" class="form-control form-control-lg border-2 rounded-end-4" 
                                       style="border-color: #dcc8c8; border-left: none;" 
                                       x-model="email" placeholder="admin@aam-group.com" required />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold" style="color: #3d1a1a;">Password</label>
                            <div class="input-group">
                                <span class="input-group-text border-2 bg-light-maroon" style="border-color: #dcc8c8; border-right: none;">
                                    <i class="bi bi-lock" style="color: #7a2a3a;"></i>
                                </span>
                                <input :type="showPassword ? 'text' : 'password'" 
                                       class="form-control form-control-lg border-2" 
                                       style="border-color: #dcc8c8; border-left: none; border-right: none;" 
                                       x-model="password" placeholder="••••••••" required />
                                <button type="button" class="btn btn-outline-secondary border-2 rounded-end-4" 
                                        style="border-color: #dcc8c8; border-left: none; background: #fcf8f8;"
                                        @click="togglePassword">
                                    <i class="bi" :class="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-maroon w-100 py-3 rounded-4 fw-bold fs-5 shadow-lg"
                                :disabled="loading">
                            <span x-show="!loading"><i class="bi bi-box-arrow-in-right me-2"></i> Masuk</span>
                            <span x-show="loading"><span class="spinner-border spinner-border-sm me-2"></span> Memproses...</span>
                        </button>
                        <div x-show="error" class="alert alert-danger mt-3 rounded-4" x-text="error" role="alert"></div>
                    </form>

                    <div class="mt-3 text-center text-secondary small">
                        <p>Gunakan <strong class="text-maroon">admin@aam-group.com</strong> / <strong class="text-maroon">password</strong></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/kita-absensi.js"></script>
</body>
</html>
